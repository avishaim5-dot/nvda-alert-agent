name: NVDA Alert Agent

on:
  schedule:
    # כל יום בשעה 07:00 UTC
    # שזה 09:00 בישראל בחורף (UTC+2)
    - cron: "0 7 * * *"
  workflow_dispatch: {}

jobs:
  run-check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Run NVDA check
        env:
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          TO_EMAIL: ${{ secrets.TO_EMAIL }}
        run: |
          python check_nvda.py
